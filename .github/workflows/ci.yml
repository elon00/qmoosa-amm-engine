name: Engine Reality CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies with strict lockfile
        run: npm ci

      - name: Static type analysis (Lint)
        run: npm run lint

      - name: Execute real engine domain logic tests
        run: npm test
